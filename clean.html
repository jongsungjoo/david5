<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>순원 중복 정리 도구</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --primary:#802B22; --bg:#F3F4F6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; font-family:'Pretendard',sans-serif; background:var(--bg); color:#1F2937; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; font-weight:900; margin:8px 0 2px; }
  .sub { font-size:13px; font-weight:700; color:#6B7280; margin-bottom:18px; }
  .card { background:#fff; border-radius:20px; padding:18px; box-shadow:0 8px 24px -8px rgba(0,0,0,.06); margin-bottom:14px; }
  button { width:100%; border:none; border-radius:14px; padding:15px; font-family:inherit; font-size:15px; font-weight:900; cursor:pointer; transition:transform .1s; }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .btn-diag { background:#fff; color:var(--primary); border:2px solid var(--primary); margin-bottom:10px; }
  .btn-del { background:var(--primary); color:#fff; }
  .status { font-size:13px; font-weight:800; color:#6B7280; min-height:18px; margin:4px 2px 0; }
  .summary { font-size:15px; font-weight:900; margin:0 0 12px; }
  .summary b { color:var(--primary); }
  .row { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; padding:9px 11px; border-radius:10px; background:#F9FAFB; border:1px solid #F0F1F3; margin-bottom:7px; }
  .keep { color:#15803D; } .del { color:var(--primary); }
  .arrow { color:#9CA3AF; font-weight:900; }
  .tag { font-size:11px; font-weight:800; padding:2px 7px; border-radius:6px; }
  .tag-y { background:#FEE2E2; color:var(--primary); } .tag-n { background:#E5E7EB; color:#6B7280; }
  .ok { color:#15803D; font-weight:900; font-size:15px; }
  .muted { color:#9CA3AF; font-weight:700; font-size:12px; }
  code { background:#F3F4F6; padding:1px 5px; border-radius:5px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>순원 중복 정리</h1>
  <p class="sub">온유공동체 다윗 5순 · <code>david-5soon-v28</code></p>

  <div class="card">
    <button class="btn-diag" id="diagBtn">① 중복 진단하기</button>
    <button class="btn-del" id="delBtn" disabled>② 중복 삭제하기</button>
    <p class="status" id="status">아래 ① 버튼을 눌러 시작하세요.</p>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <p class="summary" id="summary"></p>
    <div id="list"></div>
  </div>

  <p class="muted">진단 결과의 “유지 / 삭제” 이름이 같은지 확인한 뒤 ②를 누르세요. 정보(기도제목 등)가 더 많은 문서를 자동으로 남깁니다. 정리 후 이 파일은 지우셔도 됩니다.</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  // ── 다른 앱을 정리하려면 이 두 줄만 바꾸면 됩니다 ──
  const firebaseConfig = {
    apiKey: "AIzaSy" + "DribbbOpi9VcnLu3szJZnT06R4dhx9eww",
    authDomain: "onnuri-grace.firebaseapp.com",
    projectId: "onnuri-grace",
    storageBucket: "onnuri-grace.firebasestorage.app",
    messagingSenderId: "349044849326",
    appId: "1:349044849326:web:8fa00da5f4a81eff318b3f"
  };
  const APP_ID = "david-5soon-v28";
  // ───────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const membersPath = () => collection(db, 'artifacts', APP_ID, 'public', 'data', 'members');

  const $ = id => document.getElementById(id);
  const setStatus = (t) => $('status').textContent = t;
  let toDeleteIds = [];

  const score = m => ['name','role','prayer','birthday','children','vehicle']
    .reduce((s,k)=> s + ((m[k] && String(m[k]).trim()) ? 1 : 0), 0)
    + (m.prayer ? String(m.prayer).length/1000 : 0);

  async function readMembers() {
    const snap = await getDocs(membersPath());
    return snap.docs.map(d => ({ id:d.id, ...d.data() }));
  }

  function findDuplicates(docs) {
    const groups = {};
    docs.forEach(m => {
      const key = (m.familyId || m.id) + '|' + (m.gender || '');
      (groups[key] = groups[key] || []).push(m);
    });
    const pairs = [];
    Object.values(groups).forEach(g => {
      if (g.length <= 1) return;
      g.sort((a,b)=> score(b)-score(a));
      g.slice(1).forEach(d => pairs.push({ keep:g[0], del:d }));
    });
    return pairs;
  }

  function render(total, pairs) {
    $('resultCard').style.display = 'block';
    if (pairs.length === 0) {
      $('summary').innerHTML = `전체 <b>${total}</b>명 · 중복 <b>0</b>건 — 깨끗합니다 ✅`;
      $('list').innerHTML = '<p class="ok">정리할 중복이 없습니다.</p>';
      $('delBtn').disabled = true;
      return;
    }
    $('summary').innerHTML = `전체 <b>${total}</b>개 문서 · 삭제 예정 <b>${pairs.length}</b>건`;
    $('list').innerHTML = pairs.map(p => `
      <div class="row">
        <span class="keep">유지 ${p.keep.name || '(빈칸)'}</span>
        <span class="tag ${p.keep.prayer?'tag-y':'tag-n'}">기도 ${p.keep.prayer?'있음':'없음'}</span>
        <span class="arrow">←</span>
        <span class="del">삭제 ${p.del.name || '(빈칸)'}</span>
        <span class="tag ${p.del.prayer?'tag-y':'tag-n'}">기도 ${p.del.prayer?'있음':'없음'}</span>
      </div>`).join('');
    toDeleteIds = pairs.map(p => p.del.id);
    $('delBtn').disabled = false;
  }

  async function diagnose() {
    try {
      setStatus('로그인 중…');
      await signInAnonymously(auth);
      setStatus('명단 읽는 중…');
      const docs = await readMembers();
      const pairs = findDuplicates(docs);
      render(docs.length, pairs);
      setStatus(pairs.length ? '결과를 확인한 뒤 ②를 누르세요.' : '중복이 없습니다.');
    } catch (e) {
      console.error(e);
      setStatus('오류: ' + (e.message || e));
    }
  }

  async function remove() {
    if (!toDeleteIds.length) return;
    if (!confirm(`중복 ${toDeleteIds.length}건을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    $('delBtn').disabled = true; $('diagBtn').disabled = true;
    try {
      for (let i=0; i<toDeleteIds.length; i++) {
        await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'members', toDeleteIds[i]));
        setStatus(`삭제 중… ${i+1}/${toDeleteIds.length}`);
      }
      setStatus('삭제 완료. 다시 진단합니다…');
      toDeleteIds = [];
      await diagnose();
      setStatus('✅ 정리 완료. 앱을 새로고침하면 반영됩니다.');
    } catch (e) {
      console.error(e);
      setStatus('오류: ' + (e.message || e));
    } finally {
      $('diagBtn').disabled = false;
    }
  }

  $('diagBtn').addEventListener('click', diagnose);
  $('delBtn').addEventListener('click', remove);
</script>
</body>
</html>
